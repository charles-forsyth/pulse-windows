---
name: Bug Report
description: File a bug report for Pulse
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue with Pulse!
  - type: input
    id: os-version
    attributes:
      label: Windows Version & Architecture
      description: e.g. Windows 11 Pro 24H2 (ARM64 or x64)
      placeholder: Windows 11 Pro 24H2 (ARM64)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the problem?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false
